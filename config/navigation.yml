# Kept as data so a new page or category is a one-line change rather than a
# layout edit. Grouped by the system the data comes from, since that's how
# the admin thinks about it. Submenus keep a long category short; a link's
# `full_label` is for where the page is already known by another name than
# its submenu and label make.
shared:
  links:
    - label: Dashboard
      icon: home
      route: root

    - label: Blog
      icon: book-open
      items:
        - label: Page views
          icon: eye
          route: page_views
        - label: Page likes
          icon: heart
          route: page_likes
        - label: Subscribers
          icon: users
          route: newsletter_subscribers
        - label: Messages
          icon: message-square
          route: messages
        - label: Feed entries
          icon: rss
          route: feed_entries

    - label: Reports
      icon: bar-chart
      items:
        - label: Ranking opportunities
          icon: target
          route: ranking_report

    - label: Google
      icon: globe
      items:
        - label: Crawled pages
          icon: search-check
          route: crawled_pages
        - label: Search Console
          icon: search
          items:
            - label: Performance
              full_label: Search performance
              icon: trending-up
              route: google_search_console_performance
            - label: Sitemaps
              full_label: Sitemaps
              icon: map
              route: google_search_console_sitemaps
            - label: URL inspection
              full_label: URL inspection
              icon: file-search
              route: google_search_console_url_inspections

    - label: Monitoring
      icon: activity
      items:
        - label: Request logs
          icon: list
          route: request_logs
        - label: Sync requests
          icon: refresh
          route: sync_requests
        - label: Export requests
          icon: download
          route: export_requests
        - label: External calls
          icon: send
          route: external_calls
