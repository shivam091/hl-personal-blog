# Kept as data so a new page or category is a one-line change rather than a
# layout edit. Grouped by the system the data comes from, since that's how
# the admin thinks about it. Submenus keep a long category short; a link's
# `full_label` is for where the page is already known by another name than
# its submenu and label make.
shared:
  links:
    - label: Dashboard
      icon: home
      route: root

    - label: Blog
      icon: book-open
      items:
        - label: Page views
          icon: eye
          route: page_views
        - label: Page likes
          icon: heart
          route: page_likes
        - label: Subscribers
          icon: users
          route: newsletter_subscribers
        - label: Messages
          icon: message-square
          route: messages
        - label: Feed entries
          icon: rss
          route: feed_entries

    - label: Reports
      icon: bar-chart
      items:
        - label: Ranking opportunities
          icon: target
          route: ranking_report

    - label: Google
      icon: globe
      items:
        - label: Crawled pages
          icon: search-check
          route: crawled_pages
        - label: Search Console
          icon: search
          items:
            - label: Performance
              full_label: Search performance
              icon: trending-up
              route: google_search_console_performance
            - label: Sitemaps
              full_label: Sitemaps
              icon: map
              route: google_search_console_sitemaps
            - label: URL inspection
              full_label: URL inspection
              icon: file-search
              route: google_search_console_url_inspections
        # Named after GA's own report sections, so a page here is found where
        # it would be in GA.
        - label: Analytics
          icon: bar-chart
          items:
            - label: Acquisition
              icon: bar-chart
              route: google_analytics_acquisition
            - label: Engagement
              icon: mouse-pointer
              route: google_analytics_engagement
            - label: Users
              icon: users
              route: google_analytics_users
            - label: Retention
              icon: rotate-ccw
              route: google_analytics_retention
            - label: Cohorts
              icon: grid
              route: google_analytics_cohorts
            - label: Realtime
              icon: radio
              route: google_analytics_realtime
            - label: Funnels
              icon: funnel
              route: google_analytics_funnels
            - label: Page flow
              icon: map
              route: google_analytics_page_flow
            - label: Stickiness
              icon: heart
              route: google_analytics_stickiness
            - label: Cross-tab
              icon: columns
              route: google_analytics_cross_tab
            - label: Site search
              icon: text-search
              route: google_analytics_site_search
            - label: Settings
              icon: settings
              route: google_analytics_settings
        - label: PageSpeed
          icon: zap
          route: google_page_speed_results
        - label: Web Vitals history
          icon: timer
          route: google_crux_stats
        - label: Web Vitals (readers)
          icon: gauge
          route: google_analytics_web_vitals
        - label: Link safety
          icon: shield-alert
          route: google_safe_browsing_link_checks
        - label: reCAPTCHA
          icon: shield
          items:
            - label: Scores
              icon: shield
              route: google_recaptcha_stats
            - label: Logins
              icon: shield-check
              route: google_recaptcha_assessments

    - label: Monitoring
      icon: activity
      items:
        - label: Request logs
          icon: list
          route: request_logs
        - label: Sync requests
          icon: refresh
          route: sync_requests
        - label: Export requests
          icon: download
          route: export_requests
        - label: External calls
          icon: send
          route: external_calls
        - label: Analytics quota
          icon: gauge
          route: google_analytics_quota

    - label: Settings
      icon: settings
      items:
        - label: List layouts
          icon: columns
          route: list_settings
        - label: Saved searches
          icon: bookmark
          route: saved_searches
