# One entry per country so its codes and names can't drift apart, keyed
# by ISO 3166-1 alpha-2 because that's the code every stat is stored by.
# Search Console gives alpha-3 codes (iso3) and, in its exported reports,
# English names (names), so both are kept to match back to the key. Names
# include long, short and older spellings, since Google has used each.
# Keys are quoted because YAML reads an unquoted NO (Norway) as false.
