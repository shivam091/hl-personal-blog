shared:
  recaptcha_assessments:
    label: reCAPTCHA logins
    route: google_recaptcha_logins
    tabs: Google::Recaptcha::LoginsController::ACCEPTED_TABS
    # Newest first, since it's read for what just happened at the login.
    sort: created_at
    columns:
      created_at: {label: Time, sort: desc, required: true}
      action: {label: Action, sort: asc}
      score: {label: Score, sort: asc}
      outcome: {label: Outcome}
      password: {label: Password}
      client: {label: Client}
  analytics_acquisition:
    label: Analytics acquisition
    route: google_analytics_acquisition
    columns_from: Google::Analytics::AcquisitionController
  analytics_engagement:
    label: Analytics engagement
    route: google_analytics_engagement
    columns_from: Google::Analytics::EngagementController
  analytics_users:
    label: Analytics users
    route: google_analytics_users
    columns_from: Google::Analytics::UsersController
  analytics_retention:
    label: Analytics retention
    route: google_analytics_retention
    columns_from: Google::Analytics::RetentionController
