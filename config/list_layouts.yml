# Kept as data, apart from each list's controller, so the settings page can
# show every list's columns without loading every controller. A column's
# `sort` is the direction it first sorts in, the one most useful for it;
# columns without one can't be sorted on. `required` columns name the row,
# so a list can never be left without them. The list's own order here is
# its default order. `tabs` names the constant holding the list's quick
# filters, so its default tab can be chosen.
shared: {}
