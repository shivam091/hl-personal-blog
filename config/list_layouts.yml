# Kept as data, apart from each list's controller, so the settings page can
# show every list's columns without loading every controller. A column's
# `sort` is the direction it first sorts in, the one most useful for it;
# columns without one can't be sorted on. `required` columns name the row,
# so a list can never be left without them. The list's own order here is
# its default order. `tabs` names the constant holding the list's quick
# filters, so its default tab can be chosen. `columns_from` names a Google
# report whose figures are the columns.
shared:
  crawled_pages:
    label: Crawled pages
    route: crawled_pages
    tabs: CrawledPagesController::INDEXED_TABS
    # URL order is the default because it's how pages are looked up.
    sort: url
    columns:
      url: {label: URL, sort: asc, required: true}
      last_modified_at: {label: Last modified, sort: desc}
      indexed: {label: Indexed, sort: desc}
  recaptcha_assessments:
    label: reCAPTCHA logins
    route: google_recaptcha_logins
    tabs: Google::Recaptcha::LoginsController::ACCEPTED_TABS
    # Newest first, since it's read for what just happened at the login.
    sort: created_at
    columns:
      created_at: {label: Time, sort: desc, required: true}
      action: {label: Action, sort: asc}
      score: {label: Score, sort: asc}
      outcome: {label: Outcome}
      password: {label: Password}
      client: {label: Client}
  analytics_acquisition:
    label: Analytics acquisition
    route: google_analytics_acquisition
    columns_from: Google::Analytics::AcquisitionController
  analytics_engagement:
    label: Analytics engagement
    route: google_analytics_engagement
    columns_from: Google::Analytics::EngagementController
  analytics_users:
    label: Analytics users
    route: google_analytics_users
    columns_from: Google::Analytics::UsersController
  analytics_retention:
    label: Analytics retention
    route: google_analytics_retention
    columns_from: Google::Analytics::RetentionController
