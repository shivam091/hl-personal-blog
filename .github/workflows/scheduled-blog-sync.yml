name: Scheduled blog sync

# Its own workflow, apart from the Google syncs, since the blog's pages and
# feed change at most daily and a failing blog sync shouldn't mark the Google
# syncs failed.
on:
  schedule:
    # 00:00 UTC (05:30 IST).
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Sync crawled pages from the sitemap
        run: bin/rails crawled_pages:sync_sitemap

      # Runs even when the sitemap sync failed, since the feed doesn't depend on it.
      - name: Sync feed entries from the Atom feed
        if: ${{ !cancelled() }}
        run: bin/rails feed_entries:sync_feed

      # Google retired its sitemap ping, so the sitemap is resubmitted
      # instead; an unchanged one does no harm.
      - name: Submit the sitemap to Search Console
        if: ${{ !cancelled() }}
        run: bin/rails google:search_console:submit_sitemap

      # Right after both syncs, so an entry published today is inspected
      # today rather than in tomorrow's batch.
      - name: Inspect new entries
        if: ${{ !cancelled() }}
        run: bin/rails google:search_console:inspect_new_entries
