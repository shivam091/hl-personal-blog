name: Scheduled monitoring review

# Sunday, the day before the logs are cleared.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: scheduled-monitoring-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Mail the reminder to review the monitoring data
        run: bin/rails admin_mail:monitoring_review
