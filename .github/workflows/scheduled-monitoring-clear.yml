name: Scheduled monitoring clear

# Monday 00:00 UTC, after Sunday's review mail.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: scheduled-monitoring-clear
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Clear request logs and external calls
        run: bin/rails monitoring:clear
